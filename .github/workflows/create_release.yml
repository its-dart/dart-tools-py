name: Create a release

on:
  workflow_dispatch:
    inputs:
      type:
        description: Release type
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

run-name: Create a release - ${{ github.event.inputs.type }}

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    name: Bump version and tag release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Create release app token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14.9"

      - name: Bump version and build
        id: version
        run: |
          version=$(uv version --bump "$RELEASE_TYPE" --no-sync --short)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          uv build
        env:
          RELEASE_TYPE: ${{ inputs.type }}

      - name: Save release packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Commit and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

  publish:
    name: Publish to PyPI and create a release
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Download release packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-packages
          path: dist

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.7

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Create release app token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create a release
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
