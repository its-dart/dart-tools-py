[project]
name = "dart-tools"
version = "0.11.8"
description = "The Dart CLI and Python Library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dart", "cli", "projectmanagement", "taskmanagement"]
authors = [
  { name="Dart", email="software@dartai.com" }
]
classifiers=[
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "attrs>=26.1",
  "dateparser>=1.4",
  "flask>=3.1",
  "httpx>=0.28",
  "pick>=2.6",
  "platformdirs>=4.12",
  "rich>=15.0",
  "typing-extensions>=4.16",
  "websockets>=16.1",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
    "openapi-python-client==0.29.1",
]

[project.urls]
"Homepage" = "https://www.dartai.com/?nr=1"
"Web App" = "https://app.dartai.com/"
"Help Center" = "https://help.dartai.com/"
"Bugs and Features" = "https://github.com/its-dart/dart-tools-py/issues"
"Library Source" = "https://github.com/its-dart/dart-tools-py/"

[project.scripts]
dart = "dart:cli"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.setuptools.packages.find]
where = ["."]
include = ["dart", "dart.generated*"]

[tool.pylint.main]
py-version = "3.11"
